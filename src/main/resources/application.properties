spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=VRS
spring.datasource.password=VRS@123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# JWT Configuration
app.jwt.secret=vehicleRentalSystemSecretKeyThatIsLongEnoughForHS256AlgorithmAndMustBe256BitsOrLonger
app.jwt.expiration=86400000

# Cache Configuration
spring.cache.type=caffeine
spring.cache.cache-names=customers,vehicles,rentals
spring.cache.caffeine.spec=initialCapacity=100,maximumSize=1000,expireAfterWrite=10m,expireAfterAccess=5m,recordStats

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.VRS=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# File logging with rotation
logging.file.name=logs/vrs-application.log
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=30

# Enhanced console pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n